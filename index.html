</div>
<audio id="tik-sound" preload="auto" src="https://www.soundjay.com/buttons/sounds/button-50.mp3"></audio>
<script>
        const logo = document.getElementById('logo-trigger');
        const panel = document.getElementById('pred-panel');
        const panelHeader = document.getElementById('panel-header');
        const hideBtn = document.getElementById('hide-btn');
        const loginScreen = document.getElementById('login-screen');
        const predictionUI = document.getElementById('prediction-ui');
        const walletStatusText = document.getElementById('wallet-status');
        const linkDot = document.getElementById('link-dot');
        const statusLabel = document.getElementById('status-label');
        const tik = document.getElementById('tik-sound');

        let isUnlocked = false;
        let currentUser = null;
        let authChecker = null;

        // Generate HWID logic
        function getHWID() {
            let hwid = localStorage.getItem('hwid');
            if (!hwid) {
                hwid = 'HWID-' + Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
                localStorage.setItem('hwid', hwid);
            }
            return hwid;
        }

        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerText = message;
            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.add('show');
            }, 10);

            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => {
                    container.removeChild(toast);
                }, 300);
            }, 3000);
        }

        function updatePanelPosition() {
            if (panel.classList.contains('visible') || panel.style.display === 'block' || panel.style.display === 'flex') {
                const logoRect = logo.getBoundingClientRect();
                const panelWidth = 240;
                const panelHeight = 220;
                
                let targetX = logoRect.left + logoRect.width + 10; // 10px gap
                let targetY = logoRect.top - panelHeight - 10; // offset upwards

                const padding = 10;
                // If it goes off the right edge, snap it to the left side instead
                if (targetX + panelWidth > window.innerWidth - padding) {
                    targetX = logoRect.left - panelWidth - 10;
                }
                if (targetX < padding) targetX = padding;
                
                // If it goes off the top edge, snap to below the logo
                if (targetY < padding) {
                    targetY = logoRect.bottom + 10;
                }
                
                // Keep it within vertical bounds
                if (targetY + panelHeight > window.innerHeight - padding) {
                    targetY = window.innerHeight - panelHeight - padding;
                }

                panel.style.left = targetX + "px";
                panel.style.top = targetY + "px";
            }
        }


        function makeDraggable(element, trigger, onDragCallback = null) {
            let active = false;
            let currentX;
            let currentY;
            let initialX;
            let initialY;
            let xOffset = 0;
            let yOffset = 0;
            let hasMoved = false;

            if (element.id === 'logo-trigger') {
                xOffset = window.innerWidth - 85;
                yOffset = window.innerHeight - 85;
            } else {
                xOffset = (window.innerWidth - 240) / 2;
                yOffset = 100;
            }
            setTranslate(xOffset, yOffset, element);

            const dragStart = (e) => {
                if (e.target.closest('button') || e.target.closest('input')) return;
                
                if (e.type === "touchstart") {
                    initialX = e.touches[0].clientX - xOffset;
                    initialY = e.touches[0].clientY - yOffset;
                } else {
                    initialX = e.clientX - xOffset;
                    initialY = e.clientY - yOffset;
                }

                if (e.target === trigger || trigger.contains(e.target)) {
                    active = true;
                    hasMoved = false;
                }
            };

            const dragEnd = () => {
                initialX = currentX;
                initialY = currentY;
                active = false;
                element.dataset.hasMoved = hasMoved;
            };

            const drag = (e) => {
                if (active) {
                    if (e.cancelable) e.preventDefault();
                    
                    let clientX, clientY;
                    if (e.type === "touchmove") {
                        clientX = e.touches[0].clientX;
                        clientY = e.touches[0].clientY;
                    } else {
                        clientX = e.clientX;
                        clientY = e.clientY;
                    }

                    currentX = clientX - initialX;
                    currentY = clientY - initialY;

                    const rect = element.getBoundingClientRect();
                    currentX = Math.max(0, Math.min(currentX, window.innerWidth - rect.width));
                    currentY = Math.max(0, Math.min(currentY, window.innerHeight - rect.height));

                    xOffset = currentX;
                    yOffset = currentY;
                    
                    if (Math.abs(clientX - (initialX + xOffset)) > 5 || Math.abs(clientY - (initialY + yOffset)) > 5) {
                        hasMoved = true;
                    }

                    setTranslate(currentX, currentY, element);
                    if (onDragCallback) onDragCallback(currentX, currentY);
                }
            };

            function setTranslate(xPos, yPos, el) {
                el.style.left = xPos + "px";
                el.style.top = yPos + "px";
            }

            trigger.addEventListener("touchstart", dragStart, { passive: false });
            window.addEventListener("touchend", dragEnd, { passive: false });
            window.addEventListener("touchmove", drag, { passive: false });

            trigger.addEventListener("mousedown", dragStart, false);
            window.addEventListener("mouseup", dragEnd, false);
            window.addEventListener("mousemove", drag, false);

            return {
                moveTo: (x, y) => {
                    xOffset = x;
                    yOffset = y;
                    setTranslate(x, y, element);
                },
                getOffsets: () => ({ x: xOffset, y: yOffset }),
                getHasMoved: () => hasMoved
            };
        }

        const logoDragController = makeDraggable(logo, logo, (lx, ly) => {
            updatePanelPosition();
        });


        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 1.1;
                utterance.pitch = 0.8;
                utterance.volume = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        function playTik() {
            tik.currentTime = 0;
            tik.play().catch(() => {});
        }

        logo.addEventListener('click', (e) => {
            if (logo.dataset.hasMoved === "true") return;
            playTik();
            if (panel.classList.contains('visible') || panel.style.display === 'block' || panel.style.display === 'flex') {
                closePanel();
            } else {
                openPanel();
            }
        });

        function openPanel() {
            panel.style.display = 'flex';
            updatePanelPosition();
            requestAnimationFrame(() => {
                panel.classList.add('visible', 'panel-spring-enter');
            });
        }

        function closePanel() {
            panel.classList.remove('visible');
            setTimeout(() => {
                panel.style.display = 'none';
                panel.classList.remove('panel-spring-enter');
            }, 300);
        }

        if(hideBtn) {
            hideBtn.onclick = (e) => {
                e.stopPropagation();
                playTik();
                closePanel();
            };
        }

        async function doLogin() {
            const u = document.getElementById('lUser').value.trim();
            const p = document.getElementById('lPass').value;
            if (u && p) {
                playTik();
                
                try {
                    const userRef = window.ref(window.db, 'Users/' + u);
                    const snapshot = await window.get(userRef);

                    if (!snapshot.exists()) {
                        showToast("Invalid Key");
                        return;
                    }

                    const userData = snapshot.val();

                    if (userData.password !== p) {
                        showToast("Invalid Key");
                        return;
                    }

                    if (userData.expiry < Date.now()) {
                        showToast("Key Expired");
                        return;
                    }

                    const hwid = getHWID();
                    
                    if (userData.device_limit === 1) {
                        if (!userData.device_id || userData.device_id === hwid) {
                            if (!userData.device_id) {
                                await window.update(userRef, {
                                    device_id: hwid,
                                    is_logged: true
                                });
                            } else {
                                await window.update(userRef, { is_logged: true });
                            }
                            currentUser = u;
                            unlockSystem();
                            startAuthChecker();
                        } else {
                            showToast("Device Limit Reached");
                        }
                    } else if (userData.device_limit >= 999) {
                        await window.update(userRef, { is_logged: true });
                        currentUser = u;
                        unlockSystem();
                        startAuthChecker();
                    } else {
                         // Default logic if device_limit is not 1 or 999 (should not happen based on prompt, but just in case)
                         showToast("Invalid Device Limit");
                    }

                } catch (error) {
                    console.error("Login error", error);
                    showToast("Login Failed. Check connection.");
                }
            } else {
                showToast("Please enter Username and Passcode");
            }
        }

        function unlockSystem() {
            isUnlocked = true;
            linkDot.classList.replace('bg-gray-500', 'bg-[var(--neon-green)]');
            linkDot.classList.add('animate-blink');
            statusLabel.textContent = "ACTIVE";
            
            speak("Master panel connected. Premium edition active.");
            loginScreen.classList.add('hidden');
            predictionUI.classList.remove('hidden');
            predictionUI.classList.add('flex');
            logo.classList.add('unlocked');
            startEngine();
        }
        
        function logout() {
            isUnlocked = false;
            currentUser = null;
            if (authChecker) clearInterval(authChecker);
            
            linkDot.classList.replace('bg-[var(--neon-green)]', 'bg-gray-500');
            linkDot.classList.remove('animate-blink');
            statusLabel.textContent = "OFFLINE";
            
            loginScreen.classList.remove('hidden');
            predictionUI.classList.add('hidden');
            predictionUI.classList.remove('flex');
            logo.classList.remove('unlocked');
            
            document.getElementById('lPass').value = '';
            
            speak("Session terminated.");
            showToast("Session Expired or Terminated.");
        }

        function startAuthChecker() {
            if (authChecker) clearInterval(authChecker);
            
            authChecker = setInterval(async () => {
                if (!currentUser) return;
                
                try {
                    const userRef = window.ref(window.db, 'Users/' + currentUser);
                    const snapshot = await window.get(userRef);
                    
                    if (!snapshot.exists()) {
                        logout();
                        return;
                    }
                    
                    const userData = snapshot.val();
                    if (userData.expiry < Date.now()) {
                        logout();
                    }
                } catch (e) {
                    console.error("Auth check failed", e);
                }
            }, 10000); // Check every 10 seconds
        }


        const MATRIX=[
          {size:'BIG',targets:[5,6], num: '6', color: 'RED'},
          {size:'SMALL',targets:[5,7], num: '1', color: 'GREEN'},
          {size:'SMALL',targets:[7,9], num: '3', color: 'GREEN'},
          {size:'BIG',targets:[3,4], num: '8', color: 'RED'},
          {size:'BIG',targets:[1,3], num: '7', color: 'GREEN'},
          {size:'BIG',targets:[1,2], num: '9', color: 'GREEN'},
          {size:'SMALL',targets:[6,8], num: '2', color: 'RED'},
          {size:'SMALL',targets:[8,9], num: '0', color: 'VIOLET'}
        ];

        let stateCounter = 0;
        let lastFetched = null;
        let useProxy = false;

        async function fetchData(){
          const pri='https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json';
          const fb='https://api.allorigins.win/raw?url='+encodeURIComponent(pri);
          try{ const r=await fetch(useProxy?fb:pri); if(!r.ok) throw 0; return await r.json(); }
          catch{ if(!useProxy) useProxy=true; return null; }
        }
        
        function fetchNewPrediction() {
            playTik();
            stateCounter++;
            updatePredictionDisplay();
        }

        function updatePredictionDisplay(issueNumber = null) {
            const cfg = MATRIX[stateCounter % 8];
            
            document.getElementById('prediction-size').textContent = cfg.size;
            document.getElementById('prediction-color').textContent = cfg.color;
            
            document.getElementById('ball-1').textContent = cfg.num;
            document.getElementById('ball-2').textContent = cfg.num;
            document.getElementById('ball-3').textContent = cfg.num;
            
            const gbs = [document.getElementById('gb-1'), document.getElementById('gb-2'), document.getElementById('gb-3')];
            if(cfg.color === 'RED') {
                gbs.forEach(gb => {
                    gb.classList.add('red-node');
                    gb.classList.remove('violet-node');
                });
            } else if (cfg.color === 'VIOLET') {
                gbs.forEach(gb => {
                    gb.classList.add('violet-node');
                    gb.classList.remove('red-node');
                });
            } else {
                gbs.forEach(gb => {
                    gb.classList.remove('red-node', 'violet-node');
                });
            }

            const colorBadge = document.getElementById('color-badge');
            colorBadge.classList.remove('color-red', 'color-green', 'color-violet');
            if (cfg.color === 'RED') {
                colorBadge.classList.add('color-red');
            } else if (cfg.color === 'GREEN') {
                colorBadge.classList.add('color-green');
            } else if (cfg.color === 'VIOLET') {
                colorBadge.classList.add('color-violet');
            }

            const sizeBadge = document.getElementById('size-badge');
            sizeBadge.classList.remove('size-big', 'size-small');
            if (cfg.size === 'BIG') {
                sizeBadge.classList.add('size-big');
            } else if (cfg.size === 'SMALL') {
                sizeBadge.classList.add('size-small');
            }
            
            if(issueNumber) {
                document.getElementById('period-display').textContent = (BigInt(issueNumber)+1n).toString().slice(-7);
            }
        }

        let engineInterval;
        async function startEngine(){
          if(!isUnlocked) return;
          if(engineInterval) clearInterval(engineInterval);
          const tick=async()=>{
            if(!isUnlocked) return;
            const json=await fetchData();
            if(!json?.data?.list) return;
            const lat=json.data.list[0];
            if(lastFetched===lat.issueNumber) return;

            updatePredictionDisplay(lat.issueNumber);
            speak(`Sequence updated.`);
            
            lastFetched=lat.issueNumber; stateCounter++;
          };
          await tick();
          engineInterval = setInterval(tick,3000);
        }

        window.addEventListener('load', () => {
            const initialSpeechHandler = () => {
                speak("System interface ready.");
                document.removeEventListener('touchstart', initialSpeechHandler);
                document.removeEventListener('click', initialSpeechHandler);
            };
            document.addEventListener('touchstart', initialSpeechHandler);
            document.addEventListener('click', initialSpeechHandler);
            
            panel.style.display = 'none';
        });
        
        window.addEventListener('resize', () => {
             updatePanelPosition();
        });
    </script>
<script>
    let timeLeft = 60; 
    const timerEl = document.getElementById('timer-display'); 
    
    function startTimer() { 
        setInterval(() => { 
            timeLeft = 60 - (new Date().getSeconds());
            if (timeLeft === 60) timeLeft = 0;
            
            if (timeLeft === 0) { 
                if(typeof fetchNewPrediction === 'function' && isUnlocked) fetchNewPrediction(); 
            } 
            const s = timeLeft < 10 ? '0' + timeLeft : timeLeft; 
            if(timerEl) timerEl.textContent = `00:${s}`; 
        }, 1000); 
    } 
    
    startTimer(); 
</script></body></html>
